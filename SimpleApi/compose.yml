services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simple_api
      POSTGRES_USER: simple_api
      POSTGRES_PASSWORD: simple_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_api -d simple_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/simple_api
      DB_USERNAME: simple_api
      DB_PASSWORD: simple_api
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
