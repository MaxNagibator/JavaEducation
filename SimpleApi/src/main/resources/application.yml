spring:
  application:
    name: simple-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simple_api}
    username: ${DB_USERNAME:simple_api}
    password: ${DB_PASSWORD:simple_api}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
